<html lang="en">
<head>
    <title>All about my Pokémon Journey!</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>

        body {
            background-color: rgb(154, 187, 247);
            font-family: sans-serif;
        }
        
        .title {
            width: 100%;
            overflow: hidden;
            color: white;
        }

        .title img {
            position: fixed;
            width: 100%;
            margin: -45% 0 0 0;
            z-index: -2;
        }

        h1 {
            text-align: center;
            text-shadow: 2px 2px grey;
            font-size: 6vw;
            margin-top: 5%;
            margin-bottom: 3%;
        }

        h2 {
            text-align: center;
            text-shadow: 2px 2px grey;
            background-color: black;
            font-size: 2vw;
            margin-bottom: 3%;
        }

        button {
            font-size: 15px;
            font-family: sans-serif;
            cursor: pointer;
            padding: 2px;
        }

        #homeimg {
            width: 15px;
        }

        .map1 {
            position: relative;
            text-align: center;
            overflow: hidden;
            display: inline-block;
            width: 100%;
            height: 61dvw;
        }

        #grassField {
            width: 80dvw;
            border: 5px outset black;
            position: block;
            z-index: -1;
        }

        .poke {
            width: 8dvw;
            cursor: pointer;
            filter: brightness(50%);
            transition: filter 0.5s ease, transform 0.5s ease;
        }

        #charmander {
            position: absolute;
            width: 4.5dvw;
            top: 3dvw;
            right: 32dvw;
            z-index: 1;
        }

        #bulbasaur {
            position: absolute;
            width: 4.5dvw;
            top: 8dvw;
            right: 39dvw;
            z-index: 1;
        }

        #squirtle {
            position: absolute;
            width: 4.5dvw;
            top: 31dvw;
            right: 22dvw;
            z-index: 1;
        }

        #jigglypuff {
            position: absolute;
            width: 6dvw;
            top: 20dvw;
            right: 25dvw;
            z-index: 1;
        }

        #snorlax {
            position: absolute;
            width: 9.5dvw;
            top: 7.2dvw;
            right: 22dvw;
            z-index: 1;
        }

        .ditto-crop {
            width: 5dvw;
            height: 5dvw;
            top: 22dvw;
            right: 40dvw;
            position: absolute;
            overflow: hidden;
            z-index: 0;
        }

        #ditto {
            position: absolute;
            width: 8dvw;
            top: -0.5dvw;
            right: -1dvw;
            z-index: 2;
        }

        #mew {
            position: absolute;
            width: 5dvw;
            bottom: 9dvw;
            left: 18dvw;
            z-index: 1;
        }

        #psyduck {
            position: absolute;
            width: 12dvw;
            bottom: 21dvw;
            left: 46.5dvw;
            z-index: 1;
        }

        #magikarp {
            position: absolute;
            width: 6dvw;
            bottom: 38dvw;
            left: 22dvw;
            z-index: 1;
        }

        #eevee {
            position: absolute;
            width: 6dvw;
            bottom: 8dvw;
            right: 32dvw;
            z-index: 1;
        }

        .poke:hover {
            filter: brightness(100%);
            transform: scale(1.03);
        }
        
        /* On smaller screens, decrease text size */
        @media only screen and (max-width: 1000px) {
            #grassField {width: 100%}
            .map1 {height: 75dvw}
            #charmander {width: 6dvw; top: 4dvw; right: 27dvw}
            #bulbasaur {width: 6dvw; top: 10dvw; right: 35dvw}
            #squirtle{width: 6dvw; top: 38dvw; right: 15dvw}
            #jigglypuff{width: 7dvw; top: 25dvw; right: 19dvw}
            #snorlax {width: 11dvw; top: 9.5dvw; right: 16dvw}
            .ditto-crop {width: 6dvw; height: 6dvw; top: 28dvw; right: 38dvw}
            #ditto {width: 9dvw}
            #mew {width: 6.5dvw; bottom: 10dvw; left: 12dvw}
            #psyduck {width: 15dvw; bottom: 23dvw}
            #magikarp {width: 8dvw; bottom: 45dvw; left: 16dvw}
            #eevee {width: 8dvw; bottom: 10dvw; right: 28dvw}
        }

    </style>
</head>
